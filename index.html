<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Foxtrot Training Pulse</title>
<style>
/* Light-only, matching the ERP and Labor Pulse — OS dark mode intentionally ignored */
:root{
  color-scheme: light;
  --navy:#0f2238; --navy2:#16314f; --orange:#f07f1b; --ink:#0c1a2b;
  --paper:#f4f6f9; --surface:#ffffff; --muted:#7e8aa0; --line:#e2e7ef;
  --good:#1f9d57; --bad:#d2453b; --rowtint:#fbfcfe; --headtxt:#c7d2e2;
  --tipbg:#0f2238; --tiptx:#ffffff;
  --lms:#2f6db6; --s101:#f07f1b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Barlow','Segoe UI',system-ui,sans-serif;font-size:14px}
.topbar{display:flex;align-items:center;gap:18px;background:var(--navy);color:#fff;
  padding:0 22px;height:60px;position:sticky;top:0;z-index:30}
.brand{font-size:19px;font-weight:800;letter-spacing:.01em}
.brand span{color:var(--orange)}
.topmeta{margin-left:auto;font-size:12px;color:#9fb0c8;text-align:right;line-height:1.35}
.wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
h2{color:var(--ink);font-size:22px;font-weight:800;margin:0}
h2 .sub{color:var(--muted);font-weight:600;font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:14px 0 18px}
.controls label{font-size:13px;font-weight:600;color:var(--muted)}
select{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:180px;max-width:280px}
select:focus{outline:none;border-color:var(--orange)}
select:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;align-items:stretch;justify-content:center}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:14px 18px;min-width:168px;flex:1 1 0}
.kpi-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi-val{font-size:25px;font-weight:800;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi-val.pos{color:var(--good)} .kpi-val.neg{color:var(--bad)}
.gauge-val{font-size:24px;font-weight:800;fill:var(--ink)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 11px;color:#fff}
.badge.over{background:var(--bad)} .badge.under{background:var(--good)} .badge.na{background:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;margin-bottom:16px}
.card .hd{background:var(--navy2);color:#fff;font-weight:700;font-size:12.5px;
  padding:9px 14px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.card .hd .sub{color:#c7d2e2;font-weight:600}
.watchcard .hd{background:var(--navy)}
.scroller{overflow-x:auto}
.vscroll{overflow:auto;max-height:480px}
/* inside a vscroll the outer container does both axes, so the inner scroller
   must not clip — otherwise sticky headers stick to the wrong box */
.vscroll .scroller{overflow-x:visible}
.grid{display:grid;min-width:560px}
/* bottom tables fit their half-width card — no horizontal scrollbar */
.half .grid{min-width:0}
.grow{display:contents}
.cell{padding:7px 10px;font-size:13px;border-bottom:1px solid var(--line);
  white-space:nowrap;font-variant-numeric:tabular-nums;text-align:left;background:var(--surface);
  overflow:hidden;text-overflow:ellipsis}
.cell.num{text-align:right}
.hrow .cell{background:var(--navy);color:#fff;font-weight:700;font-size:12px;border-bottom:0;
  position:sticky;top:0;z-index:2}
.oddrow .cell{background:var(--rowtint)}
.capnote{padding:8px 12px;font-size:12px;color:var(--muted);background:var(--rowtint);
  border-top:1px solid var(--line)}
.cols{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.half{flex:1 1 480px;min-width:0}
.sec{font-size:15px;font-weight:800;color:var(--ink);margin:22px 0 10px}
.sec .sub{color:var(--muted);font-weight:600;font-size:12.5px}
.note{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--orange);
  border-radius:9px;padding:10px 14px;font-size:12.5px;line-height:1.65;color:var(--ink);margin-bottom:16px}
.note b{color:var(--orange);filter:brightness(.85)}
.note p{margin:4px 0}
.legend{display:flex;gap:16px;align-items:center;padding:10px 14px 0;font-size:12.5px;font-weight:600}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartwrap{padding:4px 14px 14px}
.cb{cursor:help}
.footer{color:var(--muted);font-size:12px;margin-top:24px}
#tip{position:fixed;z-index:99;background:var(--tipbg);color:var(--tiptx);border-radius:9px;
  padding:9px 12px;font-size:12.5px;line-height:1.55;max-width:290px;pointer-events:none;
  box-shadow:0 8px 24px #0006;display:none}
#tip .t-hd{font-weight:700;margin-bottom:2px}
@media(max-width:640px){
  .wrap{padding:14px 10px 50px}
  .topbar{padding:0 14px}
  .kpi{min-width:130px;padding:11px 14px;flex:1 1 40%}
  .kpi-val{font-size:21px}
}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const pct = (v, dp=2) => v==null ? "&mdash;" : (100*v).toFixed(dp) + "%";
const ALL = "__ALL__";
const ROWCAP = 600, THRESH = 0.20;

let rm = ALL, loc = ALL;
try{
  const s = JSON.parse(sessionStorage.getItem("tp-state") || "{}");
  if (s.rm === ALL || DATA.managers[s.rm]) rm = s.rm ?? ALL;
  if (s.loc === ALL || DATA.locations.includes(s.loc)) loc = s.loc ?? ALL;
}catch(e){}
function saveState(){ sessionStorage.setItem("tp-state", JSON.stringify({rm, loc})); }

// reverse map: location -> managers
const locMgrs = {};
Object.entries(DATA.managers).forEach(([m, locs]) =>
  locs.forEach(l => (locMgrs[l] = locMgrs[l] || []).push(m)));

function selLocs(){
  if (loc !== ALL) return new Set([loc]);
  if (rm !== ALL) return new Set(DATA.managers[rm]);
  return null;                       // null = everything
}
const inSel = (sel, l) => !sel || sel.has(l);

function sumAgg(sel){
  const t = {lmsC:0, lmsO:0, lmsI:0, sC:0, sO:0, sI:0, sP:0};
  Object.entries(DATA.locAgg).forEach(([l, a]) => {
    if (!inSel(sel, l)) return;
    Object.keys(t).forEach(k => t[k] += a[k]);
  });
  return t;
}

function scopeLabel(){
  if (loc !== ALL) return loc;
  if (rm !== ALL) return rm + " locations";
  return "all locations";
}

/* ---------- needs-attention watchlist ---------- */
function personRows(sel){
  const out = [];
  DATA.people.forEach(p => {
    if (sel && !p.l.some(l => sel.has(l))) return;
    const total = p.lc + p.lo + p.sc + p.so;   // incompletes count nowhere
    if (!total) return;
    const bad = p.lo + p.so;
    const share = bad / total;
    if (share > THRESH) out.push({p, bad, total, share});
  });
  out.sort((a,b) => b.share - a.share || b.bad - a.bad);
  return out;
}

function renderWatch(sel){
  const rows = personRows(sel);
  $("#watchhd").innerHTML = `Needs attention
    <span class="sub">${rows.length} ${rows.length===1?"person":"people"} with &gt;20% of their
    counted LMS + Safety101 items overdue &middot; O / I / C = overdue / incomplete / completed
    &middot; ${esc(scopeLabel())}</span>`;
  if (!rows.length){
    $("#watchbody").innerHTML =
      `<div style="padding:14px;color:var(--muted)">No one over the 20% line under this filter.</div>`;
    return;
  }
  const oic = (o,i,c) =>
    `<span style="color:var(--bad);font-weight:700">${o}</span> &middot; ` +
    `<span style="color:var(--muted)">${i}</span> &middot; ` +
    `<span style="color:var(--good)">${c}</span>`;
  const head = `<div class="grow hrow"><div class="cell">Employee</div><div class="cell">Job Title</div>
    <div class="cell">Location</div><div class="cell num">LMS O &middot; I &middot; C</div>
    <div class="cell num">S101 O &middot; I &middot; C</div><div class="cell num">Share overdue</div></div>`;
  const body = rows.map((r,i) => `<div class="grow ${i%2?"oddrow":""}">
    <div class="cell" style="font-weight:600">${esc(r.p.n)}</div>
    <div class="cell">${esc(r.p.t) || "&mdash;"}</div>
    <div class="cell">${esc(r.p.l.join(", "))}</div>
    <div class="cell num">${oic(r.p.lo, r.p.li, r.p.lc)}</div>
    <div class="cell num">${oic(r.p.so, r.p.si, r.p.sc)}</div>
    <div class="cell num"><span class="badge over">${(100*r.share).toFixed(0)}%</span></div>
  </div>`).join("");
  $("#watchbody").innerHTML = `<div class="grid" style="min-width:840px;
    grid-template-columns:minmax(160px,1.4fr) minmax(120px,1fr) minmax(110px,1fr) 135px 135px 140px">
    ${head}${body}</div>`;
}

/* ---------- gauges + KPI tiles ---------- */
function gaugeSVG(v, color, label, sub){
  const R = 62, CX = 82, CY = 78, LEN = Math.PI * R;
  const track = `M ${CX-R} ${CY} A ${R} ${R} 0 0 1 ${CX+R} ${CY}`;
  const off = LEN * (1 - Math.max(0, Math.min(1, v ?? 0)));
  return `<div class="kpi" style="padding:10px 14px 6px">
    <div class="kpi-label">${label}</div>
    <svg width="164" height="92" viewBox="0 0 164 92" role="img"
         aria-label="${label} ${v==null?"no data":(100*v).toFixed(2)+" percent"}">
      <path d="${track}" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/>
      <path d="${track}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${LEN}" stroke-dashoffset="${off}"/>
      <text x="${CX}" y="${CY-6}" text-anchor="middle" class="gauge-val">${v==null?"&mdash;":(100*v).toFixed(2)+"%"}</text>
    </svg>
    <div class="kpi-sub" style="margin-top:-2px">${sub}</div></div>`;
}

const share = (c, o) => (c + o) ? c / (c + o) : null;
// Safety101 compliance %: Leadership I / Management Essentials partials (sP,
// a subset of sO) still count as overdue, but earn half credit here.
const s101share = a => (a.sC + a.sO) ? (a.sC + 0.5 * (a.sP || 0)) / (a.sC + a.sO) : null;

function renderKpis(sel, t){
  const watchN = personRows(sel).length;
  $("#kpis").innerHTML =
    gaugeSVG(share(t.lmsC, t.lmsO), "var(--lms)", "LMS compliance",
      `${t.lmsC.toLocaleString()} compliant &middot; ${esc(scopeLabel())}`) +
    gaugeSVG(s101share(t), "var(--s101)", "Safety101 compliance",
      `${t.sC.toLocaleString()} compliant${t.sP ? ` &middot; ${t.sP} half-credit` : ""} &middot; ${esc(scopeLabel())}`) +
    `<div class="kpi"><div class="kpi-label">LMS courses overdue</div>
      <div class="kpi-val ${t.lmsO?"neg":"pos"}">${t.lmsO.toLocaleString()}</div>
      <div class="kpi-sub">of ${(t.lmsC + t.lmsO).toLocaleString()} counted</div></div>
    <div class="kpi"><div class="kpi-label">S101 items overdue</div>
      <div class="kpi-val ${t.sO?"neg":"pos"}">${t.sO.toLocaleString()}</div>
      <div class="kpi-sub">of ${(t.sC + t.sO).toLocaleString()} counted${t.sP ? ` &middot; ${t.sP} partial (half in %)` : ""}</div></div>
    <div class="kpi"><div class="kpi-label">People needing attention</div>
      <div class="kpi-val ${watchN?"neg":"pos"}">${watchN}</div>
      <div class="kpi-sub">over the 20% line</div></div>`;
}

/* ---------- detail tables ---------- */
function renderTable(bodyId, hdId, capId, cols, widths, rows, title, subNote = ""){
  $("#" + hdId).innerHTML = `${title}
    <span class="sub">${rows.length.toLocaleString()} row${rows.length===1?"":"s"}${subNote} &middot; ${esc(scopeLabel())}</span>`;
  const shown = rows.slice(0, ROWCAP);
  const head = `<div class="grow hrow">${cols.map(c =>
    `<div class="cell">${c}</div>`).join("")}</div>`;
  const body = shown.map((r,i) => `<div class="grow ${i%2?"oddrow":""}">${
    r.map(v => `<div class="cell" title="${esc(v)}">${esc(v) || "&mdash;"}</div>`).join("")}</div>`).join("");
  $("#" + bodyId).innerHTML = rows.length
    ? `<div class="grid" style="grid-template-columns:${widths}">${head}${body}</div>`
    : `<div style="padding:14px;color:var(--muted)">Nothing overdue under this filter.</div>`;
  const cap = $("#" + capId);
  cap.style.display = rows.length > ROWCAP ? "" : "none";
  if (rows.length > ROWCAP) cap.textContent =
    `Showing the first ${ROWCAP} of ${rows.length.toLocaleString()} rows — pick a location or manager to narrow.`;
}

function renderTables(sel){
  const lmsRows = DATA.lmsRows
    .filter(r => inSel(sel, r[2]))
    .sort((a,b) => a[2].localeCompare(b[2]) || a[0].localeCompare(b[0]));
  renderTable("lmsbody","lmshd","lmscap",
    ["Employee","Course Title","Location","Due"],
    "minmax(130px,1.1fr) minmax(180px,1.9fr) minmax(95px,.9fr) 84px",
    lmsRows, "Overdue LMS courses");

  const expRows = DATA.expRows.filter(r => inSel(sel, r[2]));
  renderTable("expbody","exphd","expcap",
    ["Employee","Job Qualification","Location","Due"],
    "minmax(140px,1.2fr) minmax(170px,1.7fr) minmax(95px,.9fr) 84px",
    expRows, "Overdue Safety101 qualifications");
}

/* ---------- by-location chart ---------- */
function renderChart(sel){
  const rows = DATA.mgmtLocs
    .filter(l => inSel(sel, l) && DATA.locAgg[l])
    .map(l => {
      const a = DATA.locAgg[l];
      return {l, a, lms: share(a.lmsC, a.lmsO), s101: s101share(a)};
    })
    .filter(r => r.s101)             // pbix filter: S101 compliance is not 0
    .sort((a,b) => a.l.localeCompare(b.l));
  if (!rows.length){
    $("#chart").innerHTML = `<div style="padding:10px;color:var(--muted)">No locations to chart under this filter.</div>`;
    return;
  }
  const LBL = 168, W = 1120, PW = W - LBL - 70, ROWH = 42, TOP = 20;
  const H = TOP + rows.length * ROWH + 8;
  const x = v => LBL + v * PW;
  const bench = x(DATA.benchmark);
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
    aria-label="LMS and Safety101 compliance by location">`;
  [0,.25,.5,.75,1].forEach(g => { s += `<line x1="${x(g)}" y1="${TOP-6}" x2="${x(g)}" y2="${H-6}"
    stroke="var(--line)" stroke-width="1"/>
    <text x="${x(g)}" y="${TOP-9}" text-anchor="middle" font-size="10" fill="var(--muted)">${g*100}%</text>`; });
  rows.forEach((r, i) => {
    const y = TOP + i * ROWH;
    const mgrs = (locMgrs[r.l] || []).join(", ");
    const tipTxt = `<div class='t-hd'>${esc(r.l)}</div>`
      + (mgrs ? `RM: ${esc(mgrs)}<br>` : "")
      + `LMS: <b>${r.a.lmsC} of ${r.a.lmsC + r.a.lmsO}</b> compliant (${pct(r.lms)})<br>`
      + `Safety101: <b>${r.a.sC} of ${r.a.sC + r.a.sO}</b> compliant`
      + (r.a.sP ? ` (incl. ${r.a.sP} partial at half credit)` : "")
      + ` (${pct(r.s101)})`;
    s += `<g class="cb" data-tip="${esc(tipTxt)}" tabindex="0">
      <rect x="0" y="${y}" width="${W}" height="${ROWH-2}" fill="transparent"/>
      <text x="${LBL-8}" y="${y+24}" text-anchor="end" font-size="12" font-weight="600"
        fill="var(--ink)">${esc(r.l)}</text>`;
    const bar = (v, off, color) => v==null ? "" :
      `<rect x="${LBL}" y="${y+off}" width="${Math.max(1.5, v*PW)}" height="13" rx="3" fill="${color}"/>
       <text x="${x(v)+5}" y="${y+off+11}" font-size="10.5" fill="var(--ink)"
         font-variant-numeric="tabular-nums">${(100*v).toFixed(0)}%</text>`;
    s += bar(r.lms, 6, "var(--lms)") + bar(r.s101, 22, "var(--s101)") + `</g>`;
  });
  s += `<line x1="${bench}" y1="${TOP-4}" x2="${bench}" y2="${H-6}" stroke="var(--muted)"
    stroke-width="1.6" stroke-dasharray="5 4"/></svg>`;
  $("#chart").innerHTML = `<div class="scroller">${s}</div>`;
}

/* ---------- controls ---------- */
function renderControls(){
  $("#rmsel").innerHTML =
    `<option value="${ALL}" ${rm===ALL?"selected":""}>All Regional Managers</option>` +
    Object.keys(DATA.managers).map(m =>
      `<option ${m===rm?"selected":""}>${esc(m)}</option>`).join("");
  const locs = rm === ALL ? DATA.locations : DATA.managers[rm];
  $("#locsel").innerHTML =
    `<option value="${ALL}" ${loc===ALL?"selected":""}>All Locations</option>` +
    locs.map(l => `<option ${l===loc?"selected":""}>${esc(l)}</option>`).join("");
}

function render(){
  const sel = selLocs();
  const t = sumAgg(sel);
  renderKpis(sel, t);
  renderWatch(sel);
  renderTables(sel);
  renderChart(sel);
}

$("#gen").textContent = DATA.asof;
renderControls(); render();

$("#rmsel").addEventListener("change", e => {
  rm = e.target.value;
  if (rm !== ALL && loc !== ALL && !DATA.managers[rm].includes(loc)) loc = ALL;
  saveState(); renderControls(); render();
});
$("#locsel").addEventListener("change", e => {
  loc = e.target.value; saveState(); render();
});

// Reload every 30 minutes so an open tab can never show stale data
setInterval(() => location.reload(), 30 * 60 * 1000);

// Scale the 1180px layout to ~92% of the screen; phones stay 1:1
function pageZoom(){ return Math.max(1, 0.92 * innerWidth / 1180); }
function applyZoom(){ document.body.style.zoom = pageZoom(); }
applyZoom();
window.addEventListener("resize", applyZoom);

// chart tooltip (single floating element; same pattern as Labor Pulse)
const tip = $("#tip");
function showTip(el){
  tip.innerHTML = el.dataset.tip;
  const Z = pageZoom(), r = el.getBoundingClientRect(),
        rl = r.left/Z, rt = r.top/Z, rb = r.bottom/Z, rw = r.width/Z,
        vw = innerWidth/Z;
  tip.style.display = "block";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(Math.max(8, rl + rw/2 - tw/2), vw - tw - 8);
  let y = rt - th - 8; if (y < 66) y = rb + 8;
  tip.style.left = x+"px"; tip.style.top = y+"px";
}
function hideTip(){ tip.style.display = "none"; }
document.addEventListener("mouseover", e => { const w = e.target.closest(".cb"); if (w) showTip(w); });
document.addEventListener("mouseout",  e => { if (e.target.closest(".cb")) hideTip(); });
document.addEventListener("focusin",   e => { const w = e.target.closest(".cb"); if (w) showTip(w); });
document.addEventListener("focusout",  e => { if (e.target.closest(".cb")) hideTip(); });
window.addEventListener("scroll", hideTip, true);
</script>
